version: "3.9"

services:
  melonhub-backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      MANAGEMENT_ADDRESS: 0.0.0.0
      MANAGEMENT_PORT: 8081
      CLOUD_DB_HOST: ${CLOUD_DB_HOST:?CLOUD_DB_HOST must be set}
      CLOUD_DB_PORT: ${CLOUD_DB_PORT:-3306}
      CLOUD_DB_NAME: ${CLOUD_DB_NAME:-melonhub_rbac}
      CLOUD_DB_USERNAME: ${CLOUD_DB_USERNAME:?CLOUD_DB_USERNAME must be set}
      CLOUD_DB_PASSWORD: ${CLOUD_DB_PASSWORD:?CLOUD_DB_PASSWORD must be set}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      # 联调阶段直接由 MySQL 校验权限，Redis 不作为部署前置条件。
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET must be set}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-https://identity.example.edu}
      IDENTITY_JWT_EXPIRES_SECONDS: ${IDENTITY_JWT_EXPIRES_SECONDS:-7200}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - target: 8080
        published: ${BACKEND_HTTP_PORT:-18080}
        mode: ingress
      - target: 8081
        published: ${BACKEND_MANAGEMENT_PORT:-18081}
        mode: ingress
    networks:
      - javaee-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  melonhub-frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    ports:
      - target: 80
        published: ${FRONTEND_HTTP_PORT:-5174}
        mode: ingress
    networks:
      - javaee-proxy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header='Host: localhost:${FRONTEND_HTTP_PORT:-5174}'
          --header='Origin: http://localhost:${FRONTEND_HTTP_PORT:-5174}' http://127.0.0.1/api/health
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: ${FRONTEND_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        order: start-first
        parallelism: 1
        monitor: 75s
        failure_action: rollback
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  javaee-proxy:
    external: true
