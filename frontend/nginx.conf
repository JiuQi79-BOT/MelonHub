map $http_host $origin_port {
    ~:(?<host_port>[0-9]+)$ $host_port;
    default $server_port;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the port published by Swarm in the origin seen by the backend.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $origin_port;

    location /api/ {
        proxy_pass http://melonhub-backend:8080/api/;
    }

    location /auth/ {
        proxy_pass http://melonhub-backend:8080/auth/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
